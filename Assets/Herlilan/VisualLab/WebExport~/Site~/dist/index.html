<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#26342e">
<title>Still Balance · 叠石</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#26342e;color:#f4f3e8;font:16px system-ui}
body{display:grid;place-items:center;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{position:relative;height:100%;width:min(100%,65dvh);background:#718276}canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
output{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:1em;background:#65796c;padding:1em}output[hidden]{display:none}
.touch{position:absolute;display:none;border:0;padding:0;background:transparent;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
<main><canvas id="unity-canvas" tabindex="0" aria-label="叠石游戏"></canvas><button class="touch" aria-label="移动"></button><button class="touch" aria-label="升降"></button><button class="touch" aria-label="切换画风"></button><output role="status">Still Balance<progress max="1" value="0"></progress></output></main>
<script src="Build/Export.loader.js"></script>
<script>
const canvas=document.querySelector('canvas'),statusPanel=document.querySelector('output');
const controls=[...document.querySelectorAll('.touch')];
let player;
window.stillBalanceTouchRect=(slot,left,top,width,height)=>{
  Object.assign(controls[slot].style,{display:'block',left:left*100+'%',top:top*100+'%',width:width*100+'%',height:height*100+'%'});
};
const send=command=>player?.SendMessage('Still Balance','WebControl',command);
controls.forEach((control,slot)=>{
  let owner=null;
  const kind=slot===0?'move':'lift';
  const drive=(event,phase)=>{
    const rect=control.getBoundingClientRect(),radius=.36*Math.min(rect.width,rect.height);
    const horizontal=slot===0?(event.clientX-rect.left-rect.width/2)/radius:0;
    const vertical=(rect.top+rect.height/2-event.clientY)/radius;
    send([kind,phase,horizontal.toFixed(3),vertical.toFixed(3)].join(','));
  };
  const end=()=>{if(owner!==null && slot!==2)send(kind+',end');owner=null};
  control.onpointerdown=event=>{
    event.preventDefault();
    if(owner!==null || !player)return;
    owner=event.pointerId;control.setPointerCapture(owner);
    if(slot!==2)drive(event,'start');
  };
  control.onpointermove=event=>{if(event.pointerId===owner && slot!==2)drive(event,'move')};
  control.onpointerup=event=>{
    if(event.pointerId!==owner)return;
    if(slot===2 && document.elementFromPoint(event.clientX,event.clientY)===control)send('style');
    end();
  };
  control.onpointercancel=control.onlostpointercapture=event=>{if(event.pointerId===owner)end()};
  control.onclick=event=>{if(slot===2 && event.detail===0)send('style')};
  for(const type of ['touchstart','touchmove','touchend','touchcancel'])control.addEventListener(type,event=>event.stopPropagation());
  window.addEventListener('blur',end);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)end()});
});
async function start(){
  try {
    player=await createUnityInstance(canvas,{
      dataUrl:'Build/Export.data.unityweb',frameworkUrl:'Build/Export.framework.js.unityweb',codeUrl:'Build/Export.wasm.unityweb',
      streamingAssetsUrl:'StreamingAssets',companyName:'Herlilan',productName:'Still Balance',productVersion:'1',
      devicePixelRatio:Math.min(devicePixelRatio,2)
    },progress=>document.querySelector('progress').value=progress);
    statusPanel.hidden=true;canvas.focus();
  }catch(error){statusPanel.textContent='游戏启动失败：'+String(error?.message||error).split('\n')[0];console.error(error)}
}
canvas.addEventListener('contextmenu',event=>event.preventDefault());start();
</script>
</html>
